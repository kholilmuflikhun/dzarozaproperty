name: Cloudflare Ops compatibility

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/ops-ux-foundation
    paths:
      - "apps/ops/**"
      - "packages/database/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/cloudflare-ops-compatibility.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-ops-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vinext-compatibility:
    name: Check Ops compatibility with vinext
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vinext compatibility check
        working-directory: apps/ops
        run: pnpm dlx vinext check
