name: Update pnpm lockfile for Ops auth dependencies

on:
  push:
    branches:
      - feat/cloudflare-better-auth
    paths:
      - apps/ops/package.json

permissions:
  contents: write

concurrency:
  group: ops-auth-lockfile
  cancel-in-progress: false

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout auth migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-better-auth
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): update pnpm lockfile [skip lockfile]"
          git push origin HEAD:feat/cloudflare-better-auth
