name: Monorepo quality gates

on:
  workflow_dispatch:
  push:
    branches: [main, integration/monorepo-main-reconciliation, feat/monorepo-saas-foundation, chore/ci-hardening-phase0-1, feat/crm-leads-api, feat/quotation-management-api, feat/phase-2-business-finance-workflows, feat/cloudflare-r2-integration, feat/document-metadata-foundation, feat/ops-ux-dashboard-foundation, feat/project-workspace-document-engine]
  pull_request:
    branches: [main, integration/monorepo-main-reconciliation, feat/monorepo-saas-foundation, feat/crm-leads-api, feat/quotation-management-api, feat/phase-2-business-finance-workflows, feat/cloudflare-r2-integration, feat/document-metadata-foundation, feat/ops-ux-dashboard-foundation]

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dzaroza?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/dzaroza?schema=public
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ci-only-not-a-production-secret
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      PLATFORM_ADMIN_EMAILS: ci-admin@example.com
      NEXT_PUBLIC_SITE_URL: https://example.com
      MIDTRANS_SERVER_KEY: ci-placeholder
      MIDTRANS_CLIENT_KEY: ci-placeholder
      MIDTRANS_IS_PRODUCTION: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dzaroza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dzaroza"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm --filter @dzaroza/database exec prisma validate --schema prisma/schema.prisma
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply database migrations
        run: pnpm db:deploy
      - name: Verify tenant-scoped database constraints
        run: psql "postgresql://postgres:postgres@localhost:5432/dzaroza" -v ON_ERROR_STOP=1 -f packages/database/prisma/tests/tenant-integrity.sql
      - name: TypeScript checks
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production builds
        run: pnpm build
      - name: Smoke test migrated public website
        run: |
          NEXTAUTH_URL=http://localhost:3000 pnpm --filter @dzaroza/marketing start > /tmp/marketing.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null
          curl --fail --silent http://127.0.0.1:3000/privasi >/dev/null
          curl --fail --silent http://127.0.0.1:3000/robots.txt >/dev/null
          curl --fail --silent http://127.0.0.1:3000/sitemap.xml >/dev/null
      - name: Smoke test Ops login page
        run: |
          NEXTAUTH_URL=http://localhost:3001 pnpm --filter @dzaroza/ops start > /tmp/ops.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/login >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3001/login >/dev/null

  reconcile-preview-prisma-history:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feat/document-metadata-foundation' &&
      contains(github.event.head_commit.message, 'reconcile Preview Prisma migration history')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PREVIEW_DIRECT_URL }}
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/document-metadata-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Preview credentials
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "PREVIEW_DATABASE_URL is missing"; exit 1; }
          test -n "$DIRECT_URL" || { echo "PREVIEW_DIRECT_URL is missing"; exit 1; }
      - name: Validate Prisma schema
        run: pnpm --filter @dzaroza/database exec prisma validate --schema prisma/schema.prisma
      - name: Preflight Neon Preview schema before recording migration history
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          table_count="$(psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
          document_columns="$(psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='Document'")"
          document_fks="$(psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM information_schema.table_constraints WHERE table_schema='public' AND table_name='Document' AND constraint_type='FOREIGN KEY'")"
          document_status="$(psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM pg_type WHERE typnamespace='public'::regnamespace AND typname='DocumentStatus'")"
          test "$table_count" = "21" || { echo "Expected 21 public tables; found $table_count"; exit 1; }
          test "$document_columns" = "15" || { echo "Expected 15 Document columns; found $document_columns"; exit 1; }
          test "$document_fks" = "4" || { echo "Expected 4 Document foreign keys; found $document_fks"; exit 1; }
          test "$document_status" = "1" || { echo "DocumentStatus enum is missing"; exit 1; }
          echo "Preview schema preflight passed: 21 tables, 15 Document columns, 4 Document foreign keys, DocumentStatus enum."
      - name: Record migrations already applied to Neon Preview
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            20261031000000_init
            20261031010000_enforce_tenant_scoped_relations
            20261031020000_snapshot_subscription_checkout_amount
            20261031030000_add_quotation_items
            20261031040000_phase2_business_finance
            20261031050000_phase2_hardening
            20261104000000_add_document_metadata
          )
          for migration in "${migrations[@]}"; do
            echo "Recording already-applied migration: $migration"
            pnpm --filter @dzaroza/database exec prisma migrate resolve --applied "$migration" --schema prisma/schema.prisma
          done
      - name: Verify Prisma migration status
        run: pnpm --filter @dzaroza/database exec prisma migrate status --schema prisma/schema.prisma
