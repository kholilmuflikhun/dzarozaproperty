name: Monorepo quality gates

on:
  workflow_dispatch:
  push:
    branches: [main, feat/monorepo-saas-foundation, chore/ci-hardening-phase0-1, feat/crm-leads-api, feat/quotation-management-api]
  pull_request:
    branches: [main, feat/monorepo-saas-foundation, feat/crm-leads-api]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dzaroza?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/dzaroza?schema=public
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ci-only-not-a-production-secret
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      PLATFORM_ADMIN_EMAILS: ci-admin@example.com
      NEXT_PUBLIC_SITE_URL: https://example.com
      MIDTRANS_SERVER_KEY: ci-placeholder
      MIDTRANS_CLIENT_KEY: ci-placeholder
      MIDTRANS_IS_PRODUCTION: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dzaroza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dzaroza"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm --filter @dzaroza/database exec prisma validate --schema prisma/schema.prisma
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply database migrations
        run: pnpm db:deploy
      - name: Verify tenant-scoped database constraints
        run: psql "postgresql://postgres:postgres@localhost:5432/dzaroza" -v ON_ERROR_STOP=1 -f packages/database/prisma/tests/tenant-integrity.sql
      - name: TypeScript checks
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production builds
        run: pnpm build
      - name: Smoke test migrated public website
        run: |
          NEXTAUTH_URL=http://localhost:3000 pnpm --filter @dzaroza/marketing start > /tmp/marketing.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null
          curl --fail --silent http://127.0.0.1:3000/privasi >/dev/null
          curl --fail --silent http://127.0.0.1:3000/robots.txt >/dev/null
          curl --fail --silent http://127.0.0.1:3000/sitemap.xml >/dev/null
      - name: Smoke test Ops login page
        run: |
          NEXTAUTH_URL=http://localhost:3001 pnpm --filter @dzaroza/ops start > /tmp/ops.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/login >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3001/login >/dev/null
