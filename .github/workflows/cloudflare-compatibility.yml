name: Cloudflare Runtime Compatibility

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/ops-ux-dashboard-foundation
    paths:
      - "apps/marketing/**"
      - "apps/ops/**"
      - "packages/database/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/cloudflare-compatibility.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vinext-check:
    name: vinext compatibility scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan Marketing app
        working-directory: apps/marketing
        run: pnpm dlx vinext check

      - name: Scan Ops app
        working-directory: apps/ops
        run: pnpm dlx vinext check
