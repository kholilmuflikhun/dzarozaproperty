name: Repair pnpm lockfile

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/repair-pnpm-lockfile.yml
  push:
    branches:
      - fix/pnpm-lockfile-sync
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/repair-pnpm-lockfile.yml

permissions:
  contents: write

concurrency:
  group: pnpm-lockfile-repair
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/pnpm-lockfile-sync

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.12.0

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.10.0 --activate
          pnpm --version

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: synchronize pnpm lockfile"
          git push origin HEAD:fix/pnpm-lockfile-sync
